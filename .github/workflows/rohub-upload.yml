name: RoHub Upload CI

on:
  push:
    branches: [ finish_rocrate ]

  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run and publish
        required: true
        default: main
      use_production_rohub:
        description: Upload to production RoHub
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  BENCHMARK_NAME: rotating-cylinders
  BENCHMARK_VERSION: 1.0.0
  BRANCH_NAME: ${{ inputs.branch || github.ref_name }}
  CODE_REPOSITORY_URL: https://github.com/${{ github.repository }}/tree/${{ inputs.branch || github.ref_name }}
  USE_PRODUCTION_ROHUB: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.use_production_rohub) || 'true' }}

jobs:
  run-dumux:
    uses: ./.github/workflows/run-benchmark-dumux.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
    secrets: inherit

  run-openfoam:
    uses: ./.github/workflows/run-benchmark-openfoam.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
    secrets: inherit

  upload-rocrates:
    runs-on: ubuntu-latest
    needs:
      - run-dumux
      - run-openfoam
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - tool: dumux
            display_name: DuMux
            used_software_url: https://zbmath.org/software/14293
          - tool: openfoam
            display_name: OpenFOAM
            used_software_url: https://zbmath.org/software/4317

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Capture branch commit SHA
        shell: bash
        run: echo "BRANCH_COMMIT_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Download ${{ matrix.display_name }} aggregate RO-Crate artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.tool }}-aggregate-rocrate
          path: artifacts/${{ matrix.tool }}

      - name: Setup Mambaforge with provenance env
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: provenance
          use-mamba: true
          environment-file: provenance/environment_provenance.yml
          conda-remove-defaults: "true"

      - name: Select RoHub credentials
        shell: bash
        run: |
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_PROD_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_PROD_PASSWORD }}" >> "${GITHUB_ENV}"
          else
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_DEV_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_DEV_PASSWORD }}" >> "${GITHUB_ENV}"
          fi

      - name: Upload ${{ matrix.display_name }} RO-Crate zip file onto RoHub
        shell: bash -l {0}
        continue-on-error: true
        env:
          TOOL: ${{ matrix.tool }}
          TOOL_DISPLAY_NAME: ${{ matrix.display_name }}
          USED_SOFTWARE_URL: ${{ matrix.used_software_url }}
        run: |
          ROCRATE_TITLE="rotating-cylinders Provenance (${TOOL_DISPLAY_NAME}) ${BENCHMARK_VERSION}"

          if [ "${BRANCH_NAME}" != "main" ]; then
            ROCRATE_TITLE="${ROCRATE_TITLE}_${BRANCH_COMMIT_SHA:0:7}"
          fi

          python provenance/upload_provenance.py \
            --provenance_folderpath "${GITHUB_WORKSPACE}/artifacts/${TOOL}/${TOOL}_rocrate.zip" \
            --benchmark-name "${BENCHMARK_NAME}" \
            --username "${ROHUB_USERNAME}" \
            --password "${ROHUB_PASSWORD}" \
            --rocrate-title "${ROCRATE_TITLE}" \
            --code-repository-url "${CODE_REPOSITORY_URL}" \
            --used-software-url "${USED_SOFTWARE_URL}" \
            --use-production-rohub "${USE_PRODUCTION_ROHUB}"

  wait-for-rohub-processing:
    runs-on: ubuntu-latest
    needs: upload-rocrates
    steps:
      - name: Wait for RoHub processing
        run: sleep 600

  process-artifacts:
    runs-on: ubuntu-latest
    needs: wait-for-rohub-processing
    env:
      USE_PRODUCTION_ROHUB: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.use_production_rohub) || 'true' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: dumux
            output_file: dumux-convergence-plot.png
          - tool: openfoam
            output_file: openfoam-convergence-plot.png

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Setup Mambaforge with provenance env
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: provenance
          use-mamba: true
          environment-file: provenance/environment_provenance.yml
          conda-remove-defaults: "true"

      - name: Run ${{ matrix.tool }} plotting script
        shell: bash -l {0}
        continue-on-error: true
        run: |
          python provenance/plot_rotating_cylinders_metrics.py \
            --tool "${{ matrix.tool }}" \
            --output-file "${{ matrix.output_file }}" \
            --code-repository-url "${CODE_REPOSITORY_URL}" \
            --use-production-rohub "${USE_PRODUCTION_ROHUB}"

      - name: Upload ${{ matrix.tool }} plot artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tool }}-plot
          path: ${{ matrix.output_file }}
          if-no-files-found: ignore
