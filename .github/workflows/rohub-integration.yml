name: RoHub Integration CI

on:
  schedule:
    - cron: '0 18 * * 5'

  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run and publish
        required: true
        default: main
      use_production_rohub:
        description: Upload to production RoHub
        required: true
        type: boolean
        default: true
      dumux_software_version:
        description: DuMux version used for this run
        required: true
        type: string
        default: '3.1'
      openfoam_software_version:
        description: OpenFOAM version used for this run
        required: true
        type: string
        default: '2412'

permissions:
  contents: read

env:
  BENCHMARK_NAME: rotating-cylinders
  BENCHMARK_ROHUB_IDENTIFIER: b6098239-ec68-41d0-87e6-992b2e4bf406
  BENCHMARK_ARTIFACT_NAME: downloaded-benchmark-resources
  BENCHMARK_FILE: downloaded-benchmark/benchmark.json
  CODE_REPOSITORY_URL: https://github.com/${{ github.repository }}/tree/${{ inputs.branch || github.ref_name }}
  USE_PRODUCTION_ROHUB: ${{ inputs.use_production_rohub }}

jobs:
  prepare-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Install semantic-benchmark
        run: python -m pip install "semantic-benchmark<=0.4.0"

      - name: Select RoHub credentials
        shell: bash
        run: |
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_PROD_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_PROD_PASSWORD }}" >> "${GITHUB_ENV}"
          else
            echo "ROHUB_USERNAME=${{ secrets.ROHUB_DEV_USERNAME }}" >> "${GITHUB_ENV}"
            echo "ROHUB_PASSWORD=${{ secrets.ROHUB_DEV_PASSWORD }}" >> "${GITHUB_ENV}"
          fi

      - name: Download benchmark RO-Crate and JSON-LD from RoHub
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/downloaded-benchmark"
          rohub_args=()
          if [ "${USE_PRODUCTION_ROHUB}" = "true" ]; then
            rohub_args=(--use-production-rohub)
          fi

          download-semantic-benchmark \
            --identifier "${BENCHMARK_ROHUB_IDENTIFIER}" \
            --username "${ROHUB_USERNAME}" \
            --password "${ROHUB_PASSWORD}" \
            --path "${GITHUB_WORKSPACE}/downloaded-benchmark" \
            --semantic-resource-filename "${GITHUB_WORKSPACE}/${BENCHMARK_FILE}" \
            "${rohub_args[@]}"

      - name: Archive downloaded benchmark resources
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BENCHMARK_ARTIFACT_NAME }}
          path: downloaded-benchmark/

  run-dumux:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-dumux.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_artifact_name: downloaded-benchmark-resources
      software_version: ${{ inputs.dumux_software_version || '3.1' }}

  run-openfoam:
    needs: prepare-benchmark
    uses: ./.github/workflows/run-benchmark-openfoam.yml
    with:
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      benchmark_file: downloaded-benchmark/benchmark.json
      benchmark_artifact_name: downloaded-benchmark-resources
      software_version: ${{ inputs.openfoam_software_version || '2412' }}

  upload:
    needs: [run-dumux, run-openfoam]
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: dumux
            display_name: DuMuX
            software_url: https://zbmath.org/software/14293
            software_version: ${{ inputs.dumux_software_version || '3.1' }}
          - tool: openfoam
            display_name: OpenFOAM
            software_url: https://zbmath.org/software/4317
            software_version: ${{ inputs.openfoam_software_version || '2412' }}
    uses: ./.github/workflows/upload-rocrate.yml
    with:
      tool: ${{ matrix.tool }}
      display_name: ${{ matrix.display_name }}
      software_url: ${{ matrix.software_url }}
      software_version: ${{ matrix.software_version }}
      checkout_ref: ${{ inputs.branch || github.ref_name }}
      use_production_rohub: ${{ inputs.use_production_rohub }}
    secrets: inherit